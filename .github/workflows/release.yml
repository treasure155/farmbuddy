# Builds FarmBuddy for Windows, macOS and Android on GitHub's machines and
# publishes the GitHub Release straight away (not a draft), including the
# signed update files that installed desktop copies download automatically.
# Each version must be released once: never "Re-run all jobs" on a published
# release (use "Re-run failed jobs"), or the update files stop matching.
#
# Trigger: `npm run release` (pushes a tag like v2.0.0), or run it by hand
# from the Actions tab.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # one .dmg for Apple Silicon and Intel Macs
            args: --target universal-apple-darwin
          - platform: windows-latest        # .exe (NSIS) and .msi installers
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the signing keys are set up
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q UNSET src-tauri/license_public_key.txt; then
            echo "::error::Licence public key missing. On the admin computer run: npm run setup-keys, then commit and push."; exit 1
          fi
          if grep -q '"pubkey": "UNSET"' src-tauri/tauri.conf.json; then
            echo "::error::Update public key missing. On the admin computer run: npm run setup-keys, then commit and push."; exit 1
          fi
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::GitHub secret TAURI_SIGNING_PRIVATE_KEY is missing. See README, 'Keys and releases'."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Optional: sign the Windows installers with your code-signing certificate.
      # Without the WINDOWS_CERTIFICATE secret the installers are built unsigned
      # (they work; Windows shows "Unknown publisher" / SmartScreen once).
      - name: Windows code signing (optional)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret: Windows installers will be unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'farmbuddy-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim()))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $f = 'src-tauri/tauri.updater.conf.json'
          $j = Get-Content $f -Raw | ConvertFrom-Json
          $j.bundle | Add-Member -NotePropertyName windows -NotePropertyValue @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } -Force
          $j | ConvertTo-Json -Depth 10 | Set-Content $f -Encoding utf8
          Write-Host "Windows installers will be signed by: $($cert.Subject)"

      # Optional: sign and notarise the Mac app with an Apple Developer ID.
      # Only the secrets you have set are passed on, so an unset secret never
      # half-starts signing. Without them the .dmg is built unsigned.
      - name: Mac code signing (optional)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No APPLE_CERTIFICATE secret: the Mac app will be unsigned."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then { echo "$v<<FB_EOF"; echo "$val"; echo "FB_EOF"; } >> "$GITHUB_ENV"; fi
          done
          [ -n "$APPLE_ID" ] && echo "Mac app will be signed and notarised." || echo "Mac app will be signed (not notarised: APPLE_ID not set)."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'FarmBuddy v__VERSION__'
          releaseBody: |
            **Windows:** download the `.exe` (or `.msi`).
            **Mac:** download the `.dmg`.
            **Android:** download the file ending in `_android.apk` (added a few minutes after the others).
            Already using FarmBuddy? It will offer this update by itself (Settings → Updates).
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  android:
    # Runs after the desktop installers so the release already exists.
    needs: build
    uses: ./.github/workflows/android.yml
    secrets: inherit
