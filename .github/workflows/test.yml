name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Type check and build the UI
        run: npm run build
      - name: UI tests (vitest)
        run: npm run test:ui
      - name: Translation keys
        run: npm run translation:check
      - name: Content package check
        run: npm run content:check -- content/example-package.json
      - name: Rust tests
        run: npm run test:rust
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity
